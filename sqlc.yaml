version: "2"
# One generated package per module, so modules never share each other's query types.
# The schema is the goose migrations (sqlc reads the Up part of each file).
sql:
  - &module
    engine: postgresql
    schema: db/migrations
    queries: db/queries/location
    gen:
      go:
        package: sqlcgen
        out: internal/modules/location/sqlcgen
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        omit_unused_structs: true
        overrides: &overrides
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/identity
    gen:
      go:
        package: sqlcgen
        out: internal/modules/identity/sqlcgen
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        omit_unused_structs: true
        overrides: *overrides
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/property
    gen:
      go:
        package: sqlcgen
        out: internal/modules/property/sqlcgen
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        omit_unused_structs: true
        # The shared overrides plus numeric as float64 (floor areas); YAML anchors cannot merge lists.
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: pg_catalog.numeric
            go_type: float64
          - db_type: pg_catalog.numeric
            nullable: true
            go_type:
              type: float64
              pointer: true

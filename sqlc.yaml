version: "2"
# One generated package (internal/adapter/persistence/postgres/sqlc) for every query under db/queries.
# The schema is the goose migrations (sqlc reads the Up part of each file).
sql:
  - engine: postgresql
    schema: db/migrations
    queries:
      - db/queries/identity
      - db/queries/location
      - db/queries/property
      - db/queries/contract
      - db/queries/plan
      - db/queries/listing
      - db/queries/invoice
      - db/queries/invitation
      - db/queries/payment
    gen:
      go:
        package: sqlc
        out: internal/adapter/persistence/postgres/sqlc
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        omit_unused_structs: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: date
            go_type: time.Time
          - db_type: date
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          # numeric as float64 (floor areas)
          - db_type: pg_catalog.numeric
            go_type: float64
          - db_type: pg_catalog.numeric
            nullable: true
            go_type:
              type: float64
              pointer: true

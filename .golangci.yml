            - pkg: rental-management/internal/adapter/persistence/postgres/listing
              desc: the contract context must not import the listing context (use a port, adapt it in cmd)
            - pkg: rental-management/internal/domain/invoice
              desc: the contract context must not import the invoice context (use a port, adapt it in cmd)
            - pkg: rental-management/internal/usecase/invoice
              desc: the contract context must not import the invoice context (use a port, adapt it in cmd)
            - pkg: rental-management/internal/adapter/http/invoice
              desc: the contract context must not import the invoice context (use a port, adapt it in cmd)
            - pkg: rental-management/internal/adapter/persistence/postgres/invoice
              desc: the contract context must not import the invoice context (use a port, adapt it in cmd)
            - pkg: rental-management/internal/usecase/invitation
              desc: reach the invitees through your own port (adapt it in cmd)
            - pkg: rental-management/internal/adapter/http/invitation
              desc: reach the invitees through your own port (adapt it in cmd)
            - pkg: rental-management/internal/adapter/persistence/postgres/invitation
              desc: reach the invitees through your own port (adapt it in cmd)
            - pkg: rental-management/internal/domain/payment
              desc: the contract context must not import the payment context (use a port, adapt it in cmd)
            - pkg: rental-management/internal/usecase/payment
              desc: the contract context must not import the payment context (use a port, adapt it in cmd)
            - pkg: rental-management/internal/adapter/http/payment
              desc: the contract context must not import the payment context (use a port, adapt it in cmd)
            - pkg: rental-management/internal/adapter/persistence/postgres/payment
              desc: the contract context must not import the payment context (use a port, adapt it in cmd)
        property-does-not-know-contract:
          files:
            - "**/internal/domain/property/**"
            - "**/internal/usecase/property/**"
            - "**/internal/adapter/http/property/**"
            - "**/internal/adapter/persistence/postgres/property/**"

version: "2"

run:
  # Lint the integration tests too.
  build-tags:
    - integration

linters:
  default: standard
  enable:
    - gosec
    - errorlint
    - bodyclose
    - misspell
    - unconvert
    - depguard
  settings:
    depguard:
      rules:
        # pkg and config are shared infrastructure: it must never depend on business code.
        shared-code-is-a-leaf:
          files:
            - "**/pkg/**"
            - "**/config/**"
          deny:
            - pkg: rental-management/internal
              desc: shared code must not import business code or the composition root
        # Clean architecture for every context (identity, location, property): adapter -> usecase -> domain.
        #
        # domain is the enterprise rules: standard library, uuid and the pure pkg/authz only.
        layer-domain:
          files:
            - "**/internal/domain/**"
          deny:
            - pkg: github.com/gin-gonic/gin
              desc: domain must not depend on the HTTP framework
            - pkg: github.com/jackc
              desc: domain must not depend on the database driver
            - pkg: github.com/redis
              desc: domain must not depend on Redis
            - pkg: github.com/golang-jwt
              desc: domain must not depend on the JWT library
            - pkg: golang.org/x/crypto
              desc: domain must not depend on cryptography libraries
            - pkg: rental-management/internal/usecase
              desc: domain must not import use cases
            - pkg: rental-management/internal/adapter
              desc: domain must not import adapters
            - pkg: rental-management/cmd
              desc: domain must not import the composition root
            - pkg: rental-management/internal/adapter/http/apperr
              desc: domain returns its own errors, the HTTP adapter maps them
            - pkg: rental-management/internal/adapter/http/httpx
              desc: domain must not import HTTP helpers
            - pkg: rental-management/pkg/db
              desc: domain must not import the database helpers
            - pkg: rental-management/pkg/mail
              desc: domain must not import the mail package
            - pkg: rental-management/pkg/storage
              desc: domain must not import the storage package
            - pkg: rental-management/pkg/imaging
              desc: domain must not import the imaging package
        # usecase is the application rules: it declares the ports it needs and never sees a framework or a driver.
        layer-usecase:
          files:
            - "**/internal/usecase/**"
          deny:
            - pkg: github.com/gin-gonic/gin
              desc: use cases must not depend on the HTTP framework
            - pkg: github.com/jackc
              desc: use cases must not depend on the database driver
            - pkg: github.com/redis
              desc: use cases must not depend on Redis
            - pkg: github.com/golang-jwt
              desc: use cases must not depend on the JWT library
            - pkg: golang.org/x/crypto
              desc: use cases must not depend on cryptography libraries
            - pkg: rental-management/internal/adapter
              desc: use cases declare ports and must not import adapters
            - pkg: rental-management/cmd
              desc: use cases must not import the composition root
            - pkg: rental-management/internal/adapter/http/apperr
              desc: use cases return domain errors, the HTTP adapter maps them
            - pkg: rental-management/internal/adapter/http/httpx
              desc: use cases must not import HTTP helpers
            - pkg: rental-management/pkg/db
              desc: use cases must not import the database helpers
            - pkg: rental-management/pkg/mail
              desc: use cases must not import the mail package
            - pkg: rental-management/pkg/storage
              desc: use cases must not import the storage package
            - pkg: rental-management/pkg/imaging
              desc: use cases must not import the imaging package
        # The adapters behind the ports implement them structurally: they may use the domain, never the use cases.
        adapter-infrastructure:
          files:
            - "**/internal/adapter/persistence/**"
            - "**/internal/adapter/redis/**"
            - "**/internal/adapter/security/**"
            - "**/internal/adapter/mail/**"
            - "**/internal/adapter/snapshot/**"
            - "**/internal/adapter/filestore/**"
            - "**/internal/adapter/imageproc/**"
          deny:
            - pkg: github.com/gin-gonic/gin
              desc: infrastructure adapters must not depend on the HTTP framework
            - pkg: rental-management/internal/usecase
              desc: infrastructure adapters implement the ports structurally and must not import use cases
            - pkg: rental-management/cmd
              desc: adapters must not import the composition root
        # The HTTP adapter turns HTTP into use case calls; it never touches the database or Redis (its integration
        # tests wire the real adapters, so test files are left out).
        adapter-http:
          files:
            - "**/internal/adapter/http/**"
            - "!$test"
          deny:
            - pkg: github.com/jackc
              desc: the HTTP adapter must not depend on the database driver
            - pkg: github.com/redis
              desc: the HTTP adapter must not depend on Redis
            - pkg: rental-management/internal/adapter/persistence
              desc: the HTTP adapter must not import the persistence adapter
            - pkg: rental-management/internal/adapter/redis
              desc: the HTTP adapter must not import the Redis adapter
            - pkg: rental-management/cmd
              desc: adapters must not import the composition root
        # Each feature has its own folder inside the HTTP and the database adapter; what they share lives in the
        # parent folder, which therefore must never import a feature folder (it would make an import cycle).
        # httpx and apperr are shared subpackages the features may import, so they are not on this list.
        shared-http-is-not-a-feature:
          files:
            - "**/internal/adapter/http/*.go"
          deny:
            - pkg: rental-management/internal/adapter/http/identity
              desc: the shared HTTP helpers must not import the feature packages
            - pkg: rental-management/internal/adapter/http/location
              desc: the shared HTTP helpers must not import the feature packages
            - pkg: rental-management/internal/adapter/http/property
              desc: the shared HTTP helpers must not import the feature packages
            - pkg: rental-management/internal/adapter/http/testenv
              desc: the shared HTTP helpers must not import the feature packages
        # httpx (envelope, middleware, binding) and apperr (error type + catalog) are leaves of the HTTP adapter:
        # they know HTTP and pkg, never business code, the features or the other adapters.
        http-helpers-are-leaves:
          files:
            - "**/internal/adapter/http/httpx/**"
            - "**/internal/adapter/http/apperr/**"
          deny:
            - pkg: rental-management/internal/domain
              desc: the HTTP helpers must not import the domain
            - pkg: rental-management/internal/usecase
              desc: the HTTP helpers must not import use cases
            - pkg: rental-management/internal/adapter/http/identity
              desc: the HTTP helpers must not import the feature packages
            - pkg: rental-management/internal/adapter/http/location
              desc: the HTTP helpers must not import the feature packages
            - pkg: rental-management/internal/adapter/http/property
              desc: the HTTP helpers must not import the feature packages
            - pkg: rental-management/internal/adapter/http/testenv
              desc: the HTTP helpers must not import the feature packages
            - pkg: rental-management/internal/adapter/persistence
              desc: the HTTP helpers must not import the persistence adapter
            - pkg: rental-management/internal/adapter/redis
              desc: the HTTP helpers must not import the Redis adapter
            - pkg: rental-management/cmd
              desc: adapters must not import the composition root
        shared-postgres-is-not-a-feature:
          files:
            - "**/internal/adapter/persistence/postgres/*.go"
          deny:
            - pkg: rental-management/internal/adapter/persistence/postgres/identity
              desc: the shared database helpers must not import the feature packages
            - pkg: rental-management/internal/adapter/persistence/postgres/location
              desc: the shared database helpers must not import the feature packages
            - pkg: rental-management/internal/adapter/persistence/postgres/property
              desc: the shared database helpers must not import the feature packages
  exclusions:
    presets:
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - rental-management

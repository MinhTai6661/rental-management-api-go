version: "2"

run:
  # Lint the integration tests too.
  build-tags:
    - integration

linters:
  default: standard
  enable:
    - gosec
    - errorlint
    - bodyclose
    - misspell
    - unconvert
    - depguard
  settings:
    depguard:
      rules:
        # pkg and config are shared infrastructure: it must never depend on business code.
        shared-code-is-a-leaf:
          files:
            - "**/pkg/**"
            - "**/config/**"
          deny:
            - pkg: rental-management/internal/modules
              desc: shared code must not import business modules
            - pkg: rental-management/internal/app
              desc: shared code must not import the wiring layer
        # modules never import each other; they share only pkg and config.
        identity-is-isolated:
          files:
            - "**/internal/modules/identity/**"
          deny:
            - pkg: rental-management/internal/modules/location
              desc: modules must not import other modules
            - pkg: rental-management/internal/modules/property
              desc: modules must not import other modules
            - pkg: rental-management/internal/app
              desc: modules must not import the wiring layer
        location-is-isolated:
          files:
            - "**/internal/modules/location/**"
          deny:
            - pkg: rental-management/internal/modules/identity
              desc: modules must not import other modules
            - pkg: rental-management/internal/modules/property
              desc: modules must not import other modules
            - pkg: rental-management/internal/app
              desc: modules must not import the wiring layer
        property-is-isolated:
          files:
            - "**/internal/modules/property/**"
          deny:
            - pkg: rental-management/internal/modules/identity
              desc: modules must not import other modules
            - pkg: rental-management/internal/modules/location
              desc: modules must not import other modules
            - pkg: rental-management/internal/app
              desc: modules must not import the wiring layer
  exclusions:
    presets:
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - rental-management

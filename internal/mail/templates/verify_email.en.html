<!doctype html>
<html lang="en">
<body style="font-family: sans-serif; line-height: 1.5; color: #1f2937;">
  <p>Hello {{.FullName}},</p>
  <p>Thanks for signing up. Please press the button below to confirm your email address.</p>
  <p><a href="{{.URL}}" style="display: inline-block; padding: 10px 18px; background: #16a34a; color: #ffffff; text-decoration: none; border-radius: 6px;">Confirm email</a></p>
  <p>Or copy this link into your browser: <br>{{.URL}}</p>
  <p style="color: #6b7280;">The link works for {{.Hours}} hours. If you did not create an account, you can ignore this email.</p>
</body>
</html>

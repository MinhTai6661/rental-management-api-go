<!doctype html>
<html lang="vi">
<body style="font-family: sans-serif; line-height: 1.5; color: #1f2937;">
  <p>Xin chào,</p>
  <p><strong>{{.Landlord}}</strong> mời bạn thuê phòng <strong>{{.Room}}</strong>.</p>
  <p><a href="{{.URL}}" style="display: inline-block; padding: 10px 18px; background: #16a34a; color: #ffffff; text-decoration: none; border-radius: 6px;">Xem lời mời</a></p>
  <p>Hoặc sao chép liên kết này vào trình duyệt: <br>{{.URL}}</p>
  <p style="color: #6b7280;">Lời mời có hiệu lực đến {{.Expires}}.</p>
  {{if .OptOutURL}}<p style="color: #6b7280;">Không muốn nhận lời mời thuê phòng qua email? <a href="{{.OptOutURL}}">Từ chối nhận lời mời</a>.</p>{{end}}
</body>
</html>

name: ci

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SQLC_VERSION: 1.30.0

jobs:
  static:
    name: format, generated code, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "run gofmt"; exit 1; }

      - name: go mod tidy leaves no diff
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: go vet
        run: go vet ./...

      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: ${{ env.SQLC_VERSION }}
      - name: sqlc generated code is up to date
        run: sqlc diff

      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

  test:
    name: unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: unit tests
        run: go test ./...

      # The runner has Docker, so testcontainers starts its Postgres and Redis directly (no host override needed).
      - name: integration tests
        run: go test -tags=integration -count=1 -p 1 ./...
